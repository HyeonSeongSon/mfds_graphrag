# 평가 문장 템플릿: T2 · T4 · T6 (1주차 D4에 잠금). 학습용 문장과 따로 작성한다(학습 데이터는 이 문장을 쓰지 않는다).
# {슬롯_label}은 build_evalset.py가 채운다. 라벨은 schema.yaml text2cypher_lookup의 속성으로 찾을 수 있어야 한다:
#   Ingredient → Ingredient.name(정규화한 이름, 예: methotrexate)
#   Article → Law.name + "제{number}조"(branch가 있으면 "의{branch}"), 예: "약사법 제23조의2"
#   Case → Case.court + " " + case_no + " 판결", 예: "대법원 2025도16747 판결"
#   Disposition → Disposition.violation_text 값 그대로(요약하지 않음). 슬롯은 평가용 그래프에서 이 값이 유일한 처분만
#   target_kind → 시행령(대통령령) · 시행규칙(총리령)
#   industry · disp_type → Disposition.industry · type 값 그대로
# 문항마다 템플릿 하나를 시드 순서로 고른다.
intents:
  - intent: t2_pair_contraindication
    templates:
      - "{ing_a_label}와 {ing_b_label}를 함께 복용해도 되나요? 병용금기인지와 근거를 알려 주세요."
      - "{ing_a_label} 성분 약을 먹는 중인데 {ing_b_label} 성분 약을 같이 써도 되나요?"
      - "{ing_a_label}와 {ing_b_label}는 병용금기 성분인가요?"
  - intent: m1_delegated_articles
    templates:
      - "{article_label}가 {target_kind_label}에 위임한 조문은 무엇인가요?"
      - "{article_label}에서 {target_kind_label}으로 정하도록 한 내용은 어느 조문에 있나요?"
  - intent: m2_case_ref_delegated
    templates:
      - "{case_label}이 참조한 법률 조문들을 구체화한 시행령 조문은 무엇인가요?"
      - "{case_label}의 참조조문에서 위임받은 시행령 규정을 찾아 주세요."
  - intent: m2_disposition_basis_delegated
    templates:
      - "'{disposition_label}'로 받은 처분의 근거 조문이 하위 법령에 위임한 조문은 무엇인가요?"
      - "'{disposition_label}' 위반 처분의 근거 규정을 구체화한 시행령 · 시행규칙 조문을 알려 주세요."
  - intent: m3_pair_and_pregnancy
    templates:
      - "{ingredient_label}와 병용금기이면서 임부에게도 금기인 성분은 무엇인가요?"
      - "{ingredient_label}와 같이 쓰면 안 되는 성분 중 임신 중 금기인 것을 알려 주세요."
  - intent: m3_pair_and_age
    templates:
      - "{ingredient_label}와 병용금기이면서 특정 연령대에 금기인 성분은 무엇인가요?"
      - "{ingredient_label}와 함께 쓰면 안 되는 성분 중 연령 제한이 있는 것을 찾아 주세요."
  - intent: m4_citing_articles
    templates:
      - "{article_label}를 인용하는 조문을 모두 찾아 주세요."
      - "{article_label}를 근거로 언급하는 다른 조문이나 고시 조항은 어디에 있나요?"
  - intent: t6_dispositions_by_article
    templates:
      - "{article_label} 위반으로 공개된 행정처분은 몇 건인가요?"
      - "{article_label}를 근거로 한 식품 행정처분 건수를 알려 주세요."
  - intent: t6_dispositions_by_industry_type
    templates:
      - "{industry} 업종에서 {disp_type} 처분은 몇 건인가요?"
      - "공개된 행정처분 중 {industry}의 {disp_type} 건수를 알려 주세요."
  - intent: t6_pair_rules_by_ingredient
    templates:
      - "{ingredient_label}와 병용금기로 지정된 조합은 몇 개인가요?"
      - "{ingredient_label}가 들어간 병용금기 규칙 수를 알려 주세요."
  - intent: t6_delegated_count
    templates:
      - "{article_label}가 하위 법령에 위임한 조문은 몇 개인가요?"
      - "{article_label}에서 위임받은 시행령 · 시행규칙 조문 수를 알려 주세요."
