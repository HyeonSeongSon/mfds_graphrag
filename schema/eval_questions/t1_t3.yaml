# 평가 문장 틀: T1(처분 → 근거 조항) · T3(판례 → 참조조문) (1주차 D4에 잠금)
# {violation}: 위반 내용(`mfds.disposition.violation_text`, 앞 `(YYYYMMDD)`만 뗌). {summary}: 판결요지(없으면 판시사항).
# 둘 다 조문 표기를 `해당 조항`으로 가린다(`eval.grouping.mask_article_refs`, PREREG 4-2). 가림 표시(`<업소명>` 등)가 든 처분은 T1 원천에서 뺀다.
# 근거 조항 · 참조조문 필드는 질문에 넣지 않는다(정답 출처).
t1:
  - "다음 위반 내용에 적용되는 법령 조항은 무엇인가요? 위반 내용: {violation}"
  - "식품 영업자가 '{violation}'(으)로 행정처분을 받았다면 근거가 되는 조문은 어디인가요?"
t3:
  - "다음 판결요지와 관련된 법령 조문을 찾아 주세요. 판결요지: {summary}"
  - "다음 판결이 근거로 삼은 조문은 무엇인가요? {summary}"
